[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssp-dmgtimenet"
version = "0.1.0"
description = "Sequential Propagation, String-Stability-aware DMGTimeNet for platoon-level car-following prediction"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "DMGTimeNet group" }]
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.0",
    "einops>=0.7",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "h5py>=3.10",
    "tensorboard>=2.16",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "black>=24.4",
]

[project.scripts]
ssp-audit = "ssp_dmgtimenet.scripts.audit_highd_platoons:main"
ssp-build = "ssp_dmgtimenet.scripts.build_platoon_samples:main"
ssp-train = "ssp_dmgtimenet.scripts.train:main"
ssp-eval  = "ssp_dmgtimenet.scripts.evaluate:main"
ssp-plot  = "ssp_dmgtimenet.scripts.plot_interpretability:main"
ssp-plot-cases = "ssp_dmgtimenet.scripts.plot_trajectory_cases:main"
ssp-plot-results = "ssp_dmgtimenet.scripts.plot_paper_results:main"

[tool.setuptools.packages.find]
include = ["ssp_dmgtimenet*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PL", "NPY", "PERF"]
ignore = ["PLR0912", "PLR0913", "PLR0915", "PLR2004"]

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
