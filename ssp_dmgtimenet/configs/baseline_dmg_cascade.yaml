include: default.yaml

model:
  name: dmg_cascade
  config:
    num_vehicles: 5
    history_steps: 50
    predict_steps: 30
    target_hz: 10.0
    d_model: 96
    num_heads: 4
    num_layers: 2
    ffn_dim: 192
    dropout: 0.1
    scales_seconds: [0.4, 0.8, 1.6]
    leader_mode: constant_velocity

loss:
  weights:
    coint: 0.0
    delay: 0.05

paths:
  checkpoint_dir: ../artifacts/checkpoints/dmg_cascade
  tensorboard_dir: ../artifacts/tensorboard/dmg_cascade
  report_dir: ../artifacts/reports/dmg_cascade
